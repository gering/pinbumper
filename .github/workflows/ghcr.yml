# Build and push ghcr.io/gering/pinbumper (linux/amd64, Synology Mars).
# Auth is GITHUB_TOKEN — do not put registry secrets in the repo.
name: GHCR

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      # On main, also tag the image with the latest v* git tag (e.g. v0.1.0 → 0.1.0).
      - name: Latest version tag
        id: version
        run: |
          set -euo pipefail
          tag="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          if [ -n "${tag}" ]; then
            echo "tag=${tag#v}" >> "${GITHUB_OUTPUT}"
          else
            echo "tag=" >> "${GITHUB_OUTPUT}"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gering/pinbumper
          flavor: |
            latest=false
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' && steps.version.outputs.tag != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
