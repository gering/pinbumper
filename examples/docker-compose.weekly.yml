# pinbumper apply-only stack (Portainer / Mars).
#
# This stack is pinbumper only — no Ofelia sidecar. Schedule weekly
# runs from a dedicated Ofelia stack (examples/docker-compose.ofelia.yml).
# Deploy those as two Portainer stacks. Do not put Ofelia inside this
# stack or any other app stack (kuma, etc.).
#
# Use the LAN Portainer URL (http://192.168.1.16:9000). Do not put Portainer
# behind Cloudflare — proxied long PUTs can hang.
#
# The pinbumper image CMD is apply — do not set command: on pinbumper.
# Pin :0.1.0 (immutable until the next v* git tag). Optional: :latest.
#
# docker compose up / a Portainer stack deploy starts pinbumper once
# (CMD apply, restart: "no"). That first start is an apply. Ofelia
# job-run (in the Ofelia stack) is additional weekly runs, not a
# substitute for it.
#
# Ofelia job-run is docker start of this existing pinbumper container,
# not a pull. A new GHCR image is not picked up until you recreate
# the pinbumper container (redeploy / compose up --force-recreate).
#
# Set PORTAINER_API_KEY as a Portainer stack Environment variable
# (${PORTAINER_API_KEY}). Do not commit the API key.
#
# File-based key (equal alternative): drop PORTAINER_API_KEY and instead set
#   environment:
#     PORTAINER_URL: http://192.168.1.16:9000
#     PORTAINER_API_KEY_FILE: /run/portainer-key
#   volumes:
#     - ${PORTAINER_API_KEY_FILE:-./portainer-api.key}:/run/portainer-key:ro

services:
  pinbumper:
    image: ghcr.io/gering/pinbumper:0.1.0
    container_name: pinbumper
    environment:
      PORTAINER_URL: http://192.168.1.16:9000
      PORTAINER_API_KEY: ${PORTAINER_API_KEY}
    restart: "no"
